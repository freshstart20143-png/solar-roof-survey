<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<title>光電屋頂探勘</title>
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand"><span class="dot"></span><span>光電屋頂探勘</span></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnLocate" aria-label="我的位置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="iconbtn" id="btnSettings" aria-label="設定">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div>

<button class="iconbtn" id="compass" aria-label="轉回正北">
  <svg viewBox="0 0 24 24" id="needle"><path d="M12 2l4 10h-8z" fill="#d64545"/><path d="M12 22l-4-10h8z" fill="#9aa5af"/></svg>
</button>

<div class="legend" id="legend"></div>

<div class="toolbar">
  <button class="tool primary" id="btnDrawNew">
    <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>劃屋頂</button>
  <button class="tool" id="btnList">
    <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>屋頂清單</button>
</div>

<div class="hint" id="hint" hidden></div>

<div class="drawpanel" id="drawPanel" hidden>
  <p>依序點屋頂的每個角（至少 3 個），點錯可以拖動藍點調整。兩指可以旋轉地圖，把房子轉正比較好劃。</p>
  <div class="area" id="drawArea">已點 0 個角</div>
  <div class="row3">
    <button class="btn" id="drawUndo">復原一點</button>
    <button class="btn" id="drawCancel">取消</button>
    <button class="btn draw" id="drawDone" disabled>完成</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="grab"></div>
  <div class="head"><h2 id="sheetTitle"></h2><button class="close" id="sheetClose" aria-label="關閉">×</button></div>
  <div class="body" id="sheetBody"></div>
</div>

<script src="maplibre-gl.js"></script>
<script src="evaluate.js"></script>
<script src="app.js"></script>
</body>
</html>
